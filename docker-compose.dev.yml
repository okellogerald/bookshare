services:
  # ─── Database ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookshare_dev}
      POSTGRES_DB: bookshare
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookshare}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Authentication (Ory) ─────────────────────────────────────
  # One-shot job: apply Hydra SQL schema before Hydra starts.
  # Required because Hydra expects its DB schema to exist at boot.
  hydra-migrate:
    image: ${ORY_HYDRA_IMAGE:-oryd/hydra:v25.4.0}
    restart: on-failure
    user: "0:0"
    environment:
      DSN: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    command: migrate -c /etc/config/hydra/hydra.yml sql up -e --yes
    volumes:
      - hydra_data:/var/lib/sqlite
      - ./infra/ory/hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro

  # Long-running Hydra OAuth2/OIDC server (public + admin APIs).
  hydra:
    image: ${ORY_HYDRA_IMAGE:-oryd/hydra:v25.4.0}
    restart: unless-stopped
    user: "0:0"
    environment:
      DSN: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    command: serve -c /etc/config/hydra/hydra.yml all --dev
    ports:
      - "4444:4444" # public
      - "4445:4445" # admin
    volumes:
      - hydra_data:/var/lib/sqlite
      - ./infra/ory/hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  # One-shot job: upsert BookShare OAuth client in Hydra admin API.
  # Required so web login works without manual client registration.
  hydra-client-init:
    image: curlimages/curl:8.12.1
    restart: "no"
    command: ["/bin/sh", "/etc/config/hydra/init-client.sh"]
    volumes:
      - ./infra/ory/hydra/init-client.sh:/etc/config/hydra/init-client.sh:ro
    depends_on:
      hydra:
        condition: service_started

  # One-shot job: apply Kratos SQL schema before Kratos starts.
  # Required because Kratos expects its DB schema to exist at boot.
  kratos-migrate:
    image: ${ORY_KRATOS_IMAGE:-oryd/kratos:v26.2.0}
    restart: on-failure
    environment:
      DSN: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    volumes:
      - kratos_data:/var/lib/sqlite
      - ./infra/ory/kratos:/etc/config/kratos:ro

  # Long-running Kratos identity/self-service engine.
  kratos:
    image: ${ORY_KRATOS_IMAGE:-oryd/kratos:v26.2.0}
    restart: unless-stopped
    environment:
      DSN: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
      LOG_LEVEL: debug
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    ports:
      - "4433:4433" # public
      - "4434:4434" # admin
    volumes:
      - kratos_data:/var/lib/sqlite
      - ./infra/ory/kratos:/etc/config/kratos:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # Long-running reusable Auth Portal UI/challenge handler.
  # Handles Kratos UI flows + Hydra login/consent/logout challenge endpoints.
  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 3337
      AUTH_PORTAL_PUBLIC_URL: ${AUTH_PORTAL_PUBLIC_URL:-http://localhost:3337}
      BOOKSHARE_APP_PUBLIC_URL: ${BOOKSHARE_APP_PUBLIC_URL:-http://localhost:3334}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookshare}:${POSTGRES_PASSWORD:-bookshare_dev}@postgres:5432/bookshare
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      KRATOS_BROWSER_URL: ${KRATOS_BROWSER_URL:-http://localhost:4433}
      KRATOS_PUBLIC_INTERNAL_URL: ${KRATOS_PUBLIC_INTERNAL_URL:-http://kratos:4433}
      HYDRA_ADMIN_URL: ${HYDRA_ADMIN_URL:-http://hydra:4445}
      HYDRA_REMEMBER_FOR: ${HYDRA_REMEMBER_FOR:-3600}
    ports:
      - "3337:3337"
    volumes:
      - ./apps/auth/src:/app/apps/auth/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/db/src:/app/packages/db/src
    depends_on:
      hydra:
        condition: service_started
      kratos:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "4436:8025"

  # ─── Read API (PostgREST) ─────────────────────────────────────
  # JWT validation uses a shared HS256 secret. NestJS mints short-lived
  # internal tokens — PostgREST never sees client tokens directly.
  postgrest:
    image: postgrest/postgrest:latest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgresql://postgrest_authenticator:postgrest_dev@postgres:5432/bookshare
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgrest_anon
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET:-change-me-in-production-min-32-chars}
      PGRST_JWT_SECRET_IS_BASE64: "false"
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3336
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_PRE_REQUEST: public.pgrst_auth_guard
      PGRST_JWT_AUD: ""
      PGRST_JWT_ROLE_CLAIM_KEY: ".role"
    ports:
      - "3336:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Object Storage ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bookshare}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bookshare_dev}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    entrypoint: /bin/sh /init.sh
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bookshare}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bookshare_dev}
      MINIO_BUCKET: ${MINIO_BUCKET_DEV:-bookshare-media-dev}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy

  # ─── Workflows (Motia) ─────────────────────────────────────
  workflows:
    build:
      context: .
      dockerfile: apps/workflows/Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 3335
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookshare}:${POSTGRES_PASSWORD:-bookshare_dev}@postgres:5432/bookshare
    ports:
      - "3335:3335"
      - "3112:3112"
      - "49134:49134"
    volumes:
      - ./apps/workflows:/app/apps/workflows
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/db/src:/app/packages/db/src
      - workflows_state:/app/apps/workflows/data
    depends_on:
      postgres:
        condition: service_healthy

  workflows-console:
    build:
      context: .
      dockerfile: apps/workflows/Dockerfile.console.dev
    restart: unless-stopped
    ports:
      - "3113:3113"
    extra_hosts:
      - "workflows.localhost:host-gateway"
    depends_on:
      workflows:
        condition: service_started

  # ─── API (NestJS) ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookshare}:${POSTGRES_PASSWORD:-bookshare_dev}@postgres:5432/bookshare
      AUTH_PROVIDER: ory
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      OIDC_ISSUER: ${OIDC_ISSUER_URL:-http://localhost:4444}
      OIDC_ISSUER_INTERNAL: ${OIDC_ISSUER_INTERNAL:-http://hydra:4444}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://hydra:4444/.well-known/jwks.json}
      OIDC_USERINFO_ENDPOINT: ${OIDC_USERINFO_ENDPOINT:-/userinfo}
      KRATOS_ADMIN_URL: ${KRATOS_ADMIN_URL:-http://kratos:4434}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-bookshare}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-bookshare_dev}
      MINIO_BUCKET: ${MINIO_BUCKET_DEV:-bookshare-media-dev}
      PUBLIC_MINIO_URL: ${PUBLIC_MINIO_URL:-http://127.0.0.1:9002}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3334}
      WORKFLOWS_URL: ${WORKFLOWS_URL:-http://workflows:3335}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SUBMISSIONS_EMAIL_TO: ${SUBMISSIONS_EMAIL_TO:-}
      POSTGREST_INTERNAL_URL: ${POSTGREST_INTERNAL_URL:-http://postgrest:3000}
      POSTGREST_JWT_SECRET: ${POSTGREST_JWT_SECRET:-change-me-in-production-min-32-chars}
    ports:
      - "3333:3333"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3333/api/docs').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/db/src:/app/packages/db/src
      - ./packages/importer/src:/app/packages/importer/src
    depends_on:
      postgres:
        condition: service_healthy
      workflows:
        condition: service_started

  # ─── Web (Next.js) ───────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 3334
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3333/api}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3333/api}
      POSTGREST_INTERNAL_URL: ${POSTGREST_INTERNAL_URL:-http://postgrest:3000}
      NEXT_PUBLIC_POSTGREST_URL: ${PUBLIC_POSTGREST_URL:-http://localhost:3336}
      AUTH_PROVIDER: ory
      NEXT_PUBLIC_OIDC_ISSUER_URL: ${PUBLIC_OIDC_URL:-http://localhost:4444}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:4444}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-http://hydra:4444}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-bookshare-web}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-http://localhost:4444/oauth2/auth}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-http://hydra:4444/oauth2/token}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://hydra:4444/.well-known/jwks.json}
      OIDC_USERINFO_ENDPOINT: ${OIDC_USERINFO_ENDPOINT:-http://hydra:4444/userinfo}
      OIDC_END_SESSION_ENDPOINT: ${OIDC_END_SESSION_ENDPOINT:-http://localhost:4444/oauth2/sessions/logout}
      OIDC_ADDITIONAL_SCOPES: ${OIDC_ADDITIONAL_SCOPES:-offline_access}
      AUTH_PORTAL_URL: ${AUTH_PORTAL_URL:-http://localhost:3337}
      NEXT_PUBLIC_AUTH_PORTAL_URL: ${NEXT_PUBLIC_AUTH_PORTAL_URL:-http://localhost:3337}
      NEXT_PUBLIC_MINIO_URL: ${PUBLIC_MINIO_URL:-http://127.0.0.1:9002}
      SESSION_SECRET: ${SESSION_SECRET:-bookshare-dev-session-secret-change-in-prod}
    ports:
      - "3334:3334"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      api:
        condition: service_started
      auth:
        condition: service_started
      hydra:
        condition: service_started
      # Ensure OAuth client exists before web begins auth redirects.
      hydra-client-init:
        condition: service_completed_successfully

  # ─── Admin (Next.js) ─────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.dev
    restart: unless-stopped
    command: ["/bin/sh", "-lc", "cd /app && bun install --frozen-lockfile && bun run --cwd apps/admin dev"]
    environment:
      PORT: 3338
      NEXT_PUBLIC_APP_URL: ${ADMIN_PUBLIC_URL:-http://localhost:3338}
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3333/api}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3333/api}
      POSTGREST_INTERNAL_URL: ${POSTGREST_INTERNAL_URL:-http://postgrest:3000}
      NEXT_PUBLIC_POSTGREST_URL: ${PUBLIC_POSTGREST_URL:-http://localhost:3336}
      NEXT_PUBLIC_OIDC_ISSUER_URL: ${PUBLIC_OIDC_URL:-http://localhost:4444}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:4444}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-http://hydra:4444}
      OIDC_CLIENT_ID: ${ADMIN_OIDC_CLIENT_ID:-bookshare-admin}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-http://localhost:4444/oauth2/auth}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-http://hydra:4444/oauth2/token}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://hydra:4444/.well-known/jwks.json}
      OIDC_USERINFO_ENDPOINT: ${OIDC_USERINFO_ENDPOINT:-http://hydra:4444/userinfo}
      OIDC_END_SESSION_ENDPOINT: ${OIDC_END_SESSION_ENDPOINT:-http://localhost:4444/oauth2/sessions/logout}
      AUTH_PORTAL_URL: ${AUTH_PORTAL_URL:-http://localhost:3337}
      NEXT_PUBLIC_AUTH_PORTAL_URL: ${NEXT_PUBLIC_AUTH_PORTAL_URL:-http://localhost:3337}
      SESSION_SECRET: ${SESSION_SECRET:-bookshare-dev-session-secret-change-in-prod}
    ports:
      - "3338:3338"
    volumes:
      - ./package.json:/app/package.json:ro
      - ./bun.lock:/app/bun.lock:ro
      - ./apps/admin/package.json:/app/apps/admin/package.json:ro
      - ./apps/admin/next.config.ts:/app/apps/admin/next.config.ts:ro
      - ./apps/admin/src:/app/apps/admin/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      api:
        condition: service_healthy
      auth:
        condition: service_started
      postgrest:
        condition: service_started
      hydra:
        condition: service_started
      hydra-client-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
  hydra_data:
  kratos_data:
  workflows_state:
