services:
  # ─── Database ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookshare_dev}
      POSTGRES_DB: bookshare
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookshare}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Authentication (Ory) ─────────────────────────────────────
  # One-shot job: apply Hydra SQL schema before Hydra starts.
  # Required because Hydra expects its DB schema to exist at boot.
  hydra-migrate:
    image: ${ORY_HYDRA_IMAGE:-oryd/hydra:v25.4.0}
    restart: on-failure
    user: "0:0"
    environment:
      DSN: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    command: migrate -c /etc/config/hydra/hydra.yml sql up -e --yes
    volumes:
      - hydra_data:/var/lib/sqlite
      - ./auth/infra/hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro

  # Long-running Hydra OAuth2/OIDC server (public + admin APIs).
  hydra:
    image: ${ORY_HYDRA_IMAGE:-oryd/hydra:v25.4.0}
    restart: unless-stopped
    user: "0:0"
    environment:
      DSN: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
      LOG_LEVEL: ${ORY_LOG_LEVEL:-debug}
      LOG_FORMAT: ${ORY_LOG_FORMAT:-json}
      LOG_LEAK_SENSITIVE_VALUES: ${ORY_LOG_LEAK_SENSITIVE_VALUES:-false}
      URLS_SELF_ISSUER: ${HYDRA_ISSUER_URL:-http://localhost:4444}
      URLS_ERROR: ${HYDRA_ERROR_URL:-http://localhost:3337/error}
      URLS_CONSENT: ${HYDRA_CONSENT_URL:-http://localhost:3337/oauth/consent}
      URLS_LOGIN: ${HYDRA_LOGIN_URL:-http://localhost:3337/oauth/login}
      URLS_LOGOUT: ${HYDRA_LOGOUT_URL:-http://localhost:3337/oauth/logout}
      URLS_DEVICE_VERIFICATION: ${HYDRA_DEVICE_VERIFICATION_URL:-http://localhost:3337/oauth/device/verify}
      URLS_DEVICE_SUCCESS: ${HYDRA_DEVICE_SUCCESS_URL:-http://localhost:3337/oauth/device/success}
    command: serve -c /etc/config/hydra/hydra.yml all --dev
    expose:
      - "4444" # public
      - "4445" # admin
    volumes:
      - hydra_data:/var/lib/sqlite
      - ./auth/infra/hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  # One-shot job: upsert BookShare OAuth client in Hydra admin API.
  # Required so web login works without manual client registration.
  hydra-client-init:
    image: curlimages/curl:8.12.1
    restart: "no"
    command: ["/bin/sh", "/etc/config/hydra/init-client.sh"]
    environment:
      HYDRA_ADMIN_URL: ${HYDRA_ADMIN_URL:-http://http-capture:4445}
    volumes:
      - ./auth/infra/hydra/init-client.sh:/etc/config/hydra/init-client.sh:ro
    depends_on:
      hydra:
        condition: service_started
      http-capture:
        condition: service_started

  # One-shot job: apply Kratos SQL schema before Kratos starts.
  # Required because Kratos expects its DB schema to exist at boot.
  kratos-migrate:
    image: ${ORY_KRATOS_IMAGE:-oryd/kratos:v26.2.0}
    restart: on-failure
    environment:
      DSN: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    volumes:
      - kratos_data:/var/lib/sqlite
      - ./auth/infra/kratos:/etc/config/kratos:ro

  # Long-running Kratos identity/self-service engine.
  kratos:
    image: ${ORY_KRATOS_IMAGE:-oryd/kratos:v26.2.0}
    restart: unless-stopped
    environment:
      DSN: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
      LOG_LEVEL: ${ORY_LOG_LEVEL:-debug}
      LOG_FORMAT: ${ORY_LOG_FORMAT:-json}
      LOG_LEAK_SENSITIVE_VALUES: ${ORY_LOG_LEAK_SENSITIVE_VALUES:-false}
      SERVE_PUBLIC_BASE_URL: ${KRATOS_PUBLIC_BASE_URL:-http://localhost:4433/}
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    expose:
      - "4433" # public
      - "4434" # admin
    volumes:
      - kratos_data:/var/lib/sqlite
      - ./auth/infra/kratos:/etc/config/kratos:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # Long-running reusable Auth Portal UI/challenge handler.
  # Handles Kratos UI flows + Hydra login/consent/logout challenge endpoints.
  auth:
    build:
      context: .
      dockerfile: auth/web/Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 3337
      AUTH_PORTAL_PUBLIC_URL: ${AUTH_PORTAL_PUBLIC_URL:-http://localhost:3337}
      BOOKSHARE_APP_PUBLIC_URL: ${BOOKSHARE_APP_PUBLIC_URL:-http://localhost:3334}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-http://localhost:3338}
      BOOKSTORES_PUBLIC_URL: ${BOOKSTORES_PUBLIC_URL:-http://localhost:3339}
      NEXT_PUBLIC_APP_URL: ${AUTH_PORTAL_PUBLIC_URL:-http://localhost:3337}
      AUTH_API_INTERNAL_URL: ${AUTH_API_INTERNAL_URL:-http://http-capture:3340/api}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookshare}:${POSTGRES_PASSWORD:-bookshare_dev}@postgres:5432/bookshare
      ADMIN_EMAIL_DOMAIN: ${ADMIN_EMAIL_DOMAIN:-bookshare.local}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      KRATOS_BROWSER_URL: ${KRATOS_BROWSER_URL:-http://localhost:4433}
      KRATOS_PUBLIC_INTERNAL_URL: ${KRATOS_PUBLIC_INTERNAL_URL:-http://http-capture:4433}
      HYDRA_ADMIN_URL: ${HYDRA_ADMIN_URL:-http://http-capture:4445}
      HYDRA_REMEMBER_FOR: ${HYDRA_REMEMBER_FOR:-3600}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:4444}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-http://http-capture:4444}
      OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-bookshare-auth}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-http://localhost:4444/oauth2/auth}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-http://http-capture:4444/oauth2/token}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://http-capture:4444/.well-known/jwks.json}
      OIDC_USERINFO_ENDPOINT: ${OIDC_USERINFO_ENDPOINT:-http://http-capture:4444/userinfo}
      OIDC_END_SESSION_ENDPOINT: ${OIDC_END_SESSION_ENDPOINT:-http://localhost:4444/oauth2/sessions/logout}
      OIDC_ADDITIONAL_SCOPES: ${OIDC_ADDITIONAL_SCOPES:-offline_access}
      SESSION_SECRET: ${SESSION_SECRET:-bookshare-dev-session-secret-change-in-prod}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_PRETTY: ${LOG_PRETTY:-true}
    expose:
      - "3337"
    volumes:
      - ./auth/web/src:/app/auth/web/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/db/src:/app/packages/db/src
      - ./packages/logger/src:/app/packages/logger/src
    depends_on:
      hydra:
        condition: service_started
      kratos:
        condition: service_started
      auth-api:
        condition: service_started

  auth-api:
    build:
      context: .
      dockerfile: auth/api/Dockerfile.dev
    restart: unless-stopped
    command: ["/bin/sh", "-lc", "bun run migrate && bun run dev"]
    environment:
      PORT: 3340
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookshare}:${POSTGRES_PASSWORD:-bookshare_dev}@postgres:5432/bookshare
      ADMIN_EMAIL_DOMAIN: ${ADMIN_EMAIL_DOMAIN:-bookshare.local}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      OIDC_ISSUER: ${OIDC_ISSUER_URL:-http://localhost:4444}
      OIDC_ISSUER_INTERNAL: ${OIDC_ISSUER_INTERNAL:-http://http-capture:4444}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://http-capture:4444/.well-known/jwks.json}
      CORS_ORIGIN: ${AUTH_PORTAL_PUBLIC_URL:-http://localhost:3337}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_PRETTY: ${LOG_PRETTY:-true}
    expose:
      - "3340"
    volumes:
      - ./auth/api/src:/app/auth/api/src
      - ./packages/logger/src:/app/packages/logger/src
    depends_on:
      postgres:
        condition: service_healthy
      hydra:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    expose:
      - "8025"

  # ─── Read API (PostgREST) ─────────────────────────────────────
  # PostgREST is internal-only. NestJS is the only caller and owns all
  # application authorization before forwarding read queries.
  postgrest:
    image: postgrest/postgrest:latest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgresql://postgrest_authenticator:postgrest_dev@postgres:5432/bookshare
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgrest_read_service
      PGRST_DB_MAX_ROWS: 1000
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Object Storage ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bookshare}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bookshare_dev}
    expose:
      - "9000"
    ports:
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    entrypoint: /bin/sh /init.sh
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bookshare}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bookshare_dev}
      MINIO_BUCKET: ${MINIO_BUCKET_DEV:-bookshare-media-dev}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy

  # ─── Workflows (Motia) ─────────────────────────────────────
  workflows:
    build:
      context: .
      dockerfile: apps/workflows/Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 3335
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookshare}:${POSTGRES_PASSWORD:-bookshare_dev}@postgres:5432/bookshare
    ports:
      - "3112:3112"
      - "49134:49134"
    expose:
      - "3335"
    volumes:
      - ./apps/workflows:/app/apps/workflows
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/db/src:/app/packages/db/src
      - workflows_state:/app/apps/workflows/data
    depends_on:
      postgres:
        condition: service_healthy

  workflows-console:
    build:
      context: .
      dockerfile: apps/workflows/Dockerfile.console.dev
    restart: unless-stopped
    ports:
      - "3113:3113"
    extra_hosts:
      - "workflows.localhost:host-gateway"
    depends_on:
      workflows:
        condition: service_started

  # ─── API (NestJS) ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookshare}:${POSTGRES_PASSWORD:-bookshare_dev}@postgres:5432/bookshare
      AUTH_PROVIDER: ory
      ADMIN_EMAIL_DOMAIN: ${ADMIN_EMAIL_DOMAIN:-bookshare.local}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      OIDC_ISSUER: ${OIDC_ISSUER_URL:-http://localhost:4444}
      OIDC_ISSUER_INTERNAL: ${OIDC_ISSUER_INTERNAL:-http://http-capture:4444}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://http-capture:4444/.well-known/jwks.json}
      OIDC_USERINFO_ENDPOINT: ${OIDC_USERINFO_ENDPOINT:-http://http-capture:4444/userinfo}
      KRATOS_ADMIN_URL: ${KRATOS_ADMIN_URL:-http://http-capture:4434}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-bookshare}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-bookshare_dev}
      MINIO_BUCKET: ${MINIO_BUCKET_DEV:-bookshare-media-dev}
      PUBLIC_MINIO_URL: ${PUBLIC_MINIO_URL:-http://127.0.0.1:9002}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3334}
      WORKFLOWS_URL: ${WORKFLOWS_URL:-http://http-capture:3335}
      # Dev email is pinned to the mailpit container so nothing ever leaves the
      # local stack. Real SMTP (Gmail/SES/etc.) is configured only in the prod
      # compose via env vars — do NOT source these from .env here, otherwise
      # a shared .env can accidentally route dev mail through a live provider.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: no-reply@bookshare.local
      SUBMISSIONS_EMAIL_TO: admin@bookshare.local
      AUTH_PORTAL_PUBLIC_URL: ${AUTH_PORTAL_PUBLIC_URL:-http://localhost:3337}
      BOOKSTORES_PUBLIC_URL: ${BOOKSTORES_PUBLIC_URL:-http://localhost:3339}
      POSTGREST_INTERNAL_URL: ${POSTGREST_INTERNAL_URL:-http://http-capture:9300}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_PRETTY: ${LOG_PRETTY:-true}
    expose:
      - "3333"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3333/api/docs').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/db/src:/app/packages/db/src
      - ./packages/importer/src:/app/packages/importer/src
      - ./packages/logger/src:/app/packages/logger/src
    depends_on:
      postgres:
        condition: service_healthy
      workflows:
        condition: service_started
      postgrest:
        condition: service_started
      mailpit:
        condition: service_started

  # ─── Web (Next.js) ───────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 3334
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3333/api}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://http-capture:3333/api}
      AUTH_PROVIDER: ory
      NEXT_PUBLIC_OIDC_ISSUER_URL: ${PUBLIC_OIDC_URL:-http://localhost:4444}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:4444}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-http://http-capture:4444}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-bookshare-web}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-http://localhost:4444/oauth2/auth}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-http://http-capture:4444/oauth2/token}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://http-capture:4444/.well-known/jwks.json}
      OIDC_USERINFO_ENDPOINT: ${OIDC_USERINFO_ENDPOINT:-http://http-capture:4444/userinfo}
      OIDC_END_SESSION_ENDPOINT: ${OIDC_END_SESSION_ENDPOINT:-http://localhost:4444/oauth2/sessions/logout}
      OIDC_ADDITIONAL_SCOPES: ${OIDC_ADDITIONAL_SCOPES:-offline_access}
      AUTH_PORTAL_URL: ${AUTH_PORTAL_URL:-http://localhost:3337}
      NEXT_PUBLIC_AUTH_PORTAL_URL: ${NEXT_PUBLIC_AUTH_PORTAL_URL:-http://localhost:3337}
      NEXT_PUBLIC_MINIO_URL: ${PUBLIC_MINIO_URL:-http://127.0.0.1:9002}
      SESSION_SECRET: ${SESSION_SECRET:-bookshare-dev-session-secret-change-in-prod}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_PRETTY: ${LOG_PRETTY:-true}
    expose:
      - "3334"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/logger/src:/app/packages/logger/src
    depends_on:
      api:
        condition: service_started
      auth:
        condition: service_started
      hydra:
        condition: service_started
      # Ensure OAuth client exists before web begins auth redirects.
      hydra-client-init:
        condition: service_completed_successfully

  # ─── Admin (Next.js) ─────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.dev
    restart: unless-stopped
    command: ["/bin/sh", "-lc", "cd /app && bun install --filter @bookshare/admin --frozen-lockfile && bun run --cwd apps/admin dev"]
    environment:
      PORT: 3338
      NEXT_PUBLIC_APP_URL: ${ADMIN_PUBLIC_URL:-http://localhost:3338}
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3333/api}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://http-capture:3333/api}
      ADMIN_EMAIL_DOMAIN: ${ADMIN_EMAIL_DOMAIN:-bookshare.local}
      NEXT_PUBLIC_OIDC_ISSUER_URL: ${PUBLIC_OIDC_URL:-http://localhost:4444}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:4444}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-http://http-capture:4444}
      OIDC_CLIENT_ID: ${ADMIN_OIDC_CLIENT_ID:-bookshare-admin}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-http://localhost:4444/oauth2/auth}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-http://http-capture:4444/oauth2/token}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://http-capture:4444/.well-known/jwks.json}
      OIDC_USERINFO_ENDPOINT: ${OIDC_USERINFO_ENDPOINT:-http://http-capture:4444/userinfo}
      OIDC_END_SESSION_ENDPOINT: ${OIDC_END_SESSION_ENDPOINT:-http://localhost:4444/oauth2/sessions/logout}
      AUTH_PORTAL_URL: ${AUTH_PORTAL_URL:-http://localhost:3337}
      NEXT_PUBLIC_AUTH_PORTAL_URL: ${NEXT_PUBLIC_AUTH_PORTAL_URL:-http://localhost:3337}
      SESSION_SECRET: ${SESSION_SECRET:-bookshare-dev-session-secret-change-in-prod}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_PRETTY: ${LOG_PRETTY:-true}
    expose:
      - "3338"
    volumes:
      - ./package.json:/app/package.json:ro
      - ./bun.lock:/app/bun.lock:ro
      - ./auth/web/package.json:/app/auth/web/package.json:ro
      - ./auth/api/package.json:/app/auth/api/package.json:ro
      - ./apps/api/package.json:/app/apps/api/package.json:ro
      - ./apps/web/package.json:/app/apps/web/package.json:ro
      - ./apps/admin/package.json:/app/apps/admin/package.json:ro
      - ./apps/bookstores/package.json:/app/apps/bookstores/package.json:ro
      - ./apps/workflows/package.json:/app/apps/workflows/package.json:ro
      - ./apps/admin/next.config.ts:/app/apps/admin/next.config.ts:ro
      - ./apps/admin/src:/app/apps/admin/src
      - ./packages/shared/package.json:/app/packages/shared/package.json:ro
      - ./packages/db/package.json:/app/packages/db/package.json:ro
      - ./packages/importer/package.json:/app/packages/importer/package.json:ro
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/logger/package.json:/app/packages/logger/package.json:ro
      - ./packages/logger/src:/app/packages/logger/src
    depends_on:
      api:
        condition: service_healthy
      auth:
        condition: service_started
      hydra:
        condition: service_started
      hydra-client-init:
        condition: service_completed_successfully

  # ─── Bookstores (Next.js) ────────────────────────────────────
  bookstores:
    build:
      context: .
      dockerfile: apps/bookstores/Dockerfile.dev
    restart: unless-stopped
    command: ["/bin/sh", "-lc", "cd /app && bun install --filter @bookshare/bookstores --frozen-lockfile && bun run --cwd apps/bookstores dev"]
    environment:
      PORT: 3339
      NEXT_PUBLIC_APP_URL: ${BOOKSTORES_PUBLIC_URL:-http://localhost:3339}
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3333/api}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://http-capture:3333/api}
      NEXT_PUBLIC_OIDC_ISSUER_URL: ${PUBLIC_OIDC_URL:-http://localhost:4444}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:4444}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-http://http-capture:4444}
      OIDC_CLIENT_ID: ${BOOKSTORES_OIDC_CLIENT_ID:-bookshare-bookstores}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-http://localhost:4444/oauth2/auth}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-http://http-capture:4444/oauth2/token}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://http-capture:4444/.well-known/jwks.json}
      OIDC_USERINFO_ENDPOINT: ${OIDC_USERINFO_ENDPOINT:-http://http-capture:4444/userinfo}
      OIDC_END_SESSION_ENDPOINT: ${OIDC_END_SESSION_ENDPOINT:-http://localhost:4444/oauth2/sessions/logout}
      OIDC_ADDITIONAL_SCOPES: ${OIDC_ADDITIONAL_SCOPES:-offline_access}
      AUTH_PORTAL_URL: ${AUTH_PORTAL_URL:-http://localhost:3337}
      NEXT_PUBLIC_AUTH_PORTAL_URL: ${NEXT_PUBLIC_AUTH_PORTAL_URL:-http://localhost:3337}
      SESSION_SECRET: ${SESSION_SECRET:-bookshare-dev-session-secret-change-in-prod}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_PRETTY: ${LOG_PRETTY:-true}
    expose:
      - "3339"
    volumes:
      - ./package.json:/app/package.json:ro
      - ./bun.lock:/app/bun.lock:ro
      - ./auth/web/package.json:/app/auth/web/package.json:ro
      - ./auth/api/package.json:/app/auth/api/package.json:ro
      - ./apps/api/package.json:/app/apps/api/package.json:ro
      - ./apps/web/package.json:/app/apps/web/package.json:ro
      - ./apps/admin/package.json:/app/apps/admin/package.json:ro
      - ./apps/bookstores/package.json:/app/apps/bookstores/package.json:ro
      - ./apps/workflows/package.json:/app/apps/workflows/package.json:ro
      - ./apps/bookstores/next.config.ts:/app/apps/bookstores/next.config.ts:ro
      - ./apps/bookstores/src:/app/apps/bookstores/src
      - ./packages/shared/package.json:/app/packages/shared/package.json:ro
      - ./packages/db/package.json:/app/packages/db/package.json:ro
      - ./packages/importer/package.json:/app/packages/importer/package.json:ro
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/logger/package.json:/app/packages/logger/package.json:ro
      - ./packages/logger/src:/app/packages/logger/src
    depends_on:
      api:
        condition: service_healthy
      auth:
        condition: service_started
      hydra:
        condition: service_started
      hydra-client-init:
        condition: service_completed_successfully

  # ─── HTTP Capture (mitmproxy) ────────────────────────────────
  # Default dev front door for HTTP request/response body capture.
  # Web UI: http://localhost:8090, password: bookshare.
  # The usual localhost service ports below are reverse-proxied to their
  # containers so browser traffic and server-to-server calls are captured.
  http-capture:
    image: mitmproxy/mitmproxy:latest
    restart: unless-stopped
    command:
      - mitmweb
      - --web-host
      - 0.0.0.0
      - --web-port
      - "8090"
      - --listen-host
      - 0.0.0.0
      - --set
      - block_global=false
      - --set
      - web_password=bookshare
      - --mode
      - reverse:http://hydra:4444@4444
      - --mode
      - reverse:http://hydra:4445@4445
      - --mode
      - reverse:http://kratos:4433@4433
      - --mode
      - reverse:http://kratos:4434@4434
      - --mode
      - reverse:http://auth:3337@3337
      - --mode
      - reverse:http://auth-api:3340@3340
      - --mode
      - reverse:http://web:3334@3334
      - --mode
      - reverse:http://admin:3338@3338
      - --mode
      - reverse:http://bookstores:3339@3339
      - --mode
      - reverse:http://api:3333@3333
      - --mode
      - reverse:http://workflows:3335@3335
      - --mode
      - reverse:http://postgrest:3000@9300
      - --mode
      - reverse:http://minio:9000@9002
      - --mode
      - reverse:http://mailpit:8025@4436
    ports:
      - "8090:8090" # mitmproxy UI
      - "4444:4444" # Hydra public
      - "4445:4445" # Hydra admin
      - "4433:4433" # Kratos public
      - "4434:4434" # Kratos admin
      - "3337:3337" # Auth Portal
      - "3340:3340" # Auth API
      - "3334:3334" # Web
      - "3338:3338" # Admin
      - "3339:3339" # Bookstores
      - "3333:3333" # API
      - "3335:3335" # Workflows
      - "9300:9300" # PostgREST
      - "9002:9002" # MinIO API
      - "4436:4436" # Mailpit UI
  # ─── Log Viewer (Dozzle) ─────────────────────────────────────
  # Web UI for browsing Docker logs across all services.
  # Visit http://localhost:8080 — search/filter by traceId, container, etc.
  # Read-only socket mount: Dozzle only reads container logs/metadata.
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
  minio_data:
  hydra_data:
  kratos_data:
  workflows_state:
