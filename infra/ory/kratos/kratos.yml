# BookShare development Kratos config.
# Contributor guide: infra/ory/README.md

version: v1.3.1

dsn: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  # Browser default when Kratos flow has no explicit `return_to`.
  default_browser_return_url: http://localhost:3337
  # Explicitly allow Auth Portal + BookShare callback resume paths.
  allowed_return_urls:
    - http://localhost:3337
    - http://localhost:3334
    - http://localhost:3334/api/auth/login
    - http://localhost:3337/oauth/login

  methods:
    password:
      enabled: true
      config:
        # Keep local registration reliable when the external breach API is
        # unavailable or slow under the dev stack.
        haveibeenpwned_enabled: false
    # Used for verification and recovery codes only.
    code:
      enabled: true
      passwordless_enabled: false
      config:
        # Keep verification/recovery code validity aligned with our current flow timings.
        lifespan: 1h

  flows:
    error:
      ui_url: http://localhost:3337/error

    settings:
      ui_url: http://localhost:3337/settings
      privileged_session_max_age: 15m
      after:
        default_browser_return_url: http://localhost:3337/settings/complete

    recovery:
      enabled: true
      ui_url: http://localhost:3337/recovery
      use: code

    verification:
      enabled: true
      ui_url: http://localhost:3337/verification
      use: code
      after:
        default_browser_return_url: http://localhost:3337/login

    logout:
      after:
        default_browser_return_url: http://localhost:3337/login

    login:
      ui_url: http://localhost:3337/login
      lifespan: 10m
      after:
        default_browser_return_url: http://localhost:3337/oauth/login

    registration:
      # Keep enough time for users to complete the registration form.
      lifespan: 1h
      ui_url: http://localhost:3337/register
      after:
        password:
          hooks:
            # Redirects into verification UI right after password registration.
            - hook: show_verification_ui

log:
  level: info
  format: text

secrets:
  cookie:
    - change-this-dev-cookie-secret
  cipher:
    - 32-char-dev-secret-change-me-123

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      # Trait schema used by registration/settings forms.
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    # Dev mail sink (Mailpit container in docker-compose.dev.yml).
    connection_uri: smtp://mailpit:1025/?skip_ssl_verify=true&disable_starttls=true
