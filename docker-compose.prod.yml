services:
  # ─── Database ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bookshare
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Read API (PostgREST) ─────────────────────────────────────
  postgrest:
    image: postgrest/postgrest:latest
    restart: always
    environment:
      PGRST_DB_URI: postgresql://postgrest_authenticator:${POSTGREST_DB_PASSWORD}@postgres:5432/bookshare
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgrest_auth
      PGRST_JWT_SECRET: ${OIDC_JWT_SECRET}
      PGRST_JWT_SECRET_IS_BASE64: "false"
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_PRE_REQUEST: public.pgrst_auth_guard
      PGRST_JWT_AUD: ""
      PGRST_JWT_ROLE_CLAIM_KEY: ".role"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── Object Storage ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  minio-init:
    image: minio/mc:latest
    entrypoint: /bin/sh /init.sh
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET_PROD:-bookshare-media-prod}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy

  # ─── API (NestJS) ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    restart: always
    environment:
      PORT: 3333
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/bookshare
      AUTH_PROVIDER: ory
      OIDC_ISSUER: ${OIDC_ISSUER_URL}
      OIDC_ISSUER_INTERNAL: ${OIDC_ISSUER_INTERNAL}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OIDC_USERINFO_ENDPOINT: ${OIDC_USERINFO_ENDPOINT:-/userinfo}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET_PROD:-bookshare-media-prod}
      PUBLIC_MINIO_URL: ${PUBLIC_MINIO_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SUBMISSIONS_EMAIL_TO: ${SUBMISSIONS_EMAIL_TO}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Web (Next.js) ───────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    restart: always
    environment:
      PORT: 3334
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3333/api}
      POSTGREST_INTERNAL_URL: ${POSTGREST_INTERNAL_URL:-http://postgrest:3000}
      AUTH_PROVIDER: ory
      NEXT_PUBLIC_OIDC_ISSUER_URL: ${PUBLIC_OIDC_URL}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OIDC_USERINFO_ENDPOINT: ${OIDC_USERINFO_ENDPOINT}
      OIDC_END_SESSION_ENDPOINT: ${OIDC_END_SESSION_ENDPOINT}
      OIDC_ADDITIONAL_SCOPES: ${OIDC_ADDITIONAL_SCOPES:-offline_access}
      AUTH_PORTAL_URL: ${AUTH_PORTAL_URL:-http://localhost:3337}
      NEXT_PUBLIC_AUTH_PORTAL_URL: ${NEXT_PUBLIC_AUTH_PORTAL_URL:-http://localhost:3337}
      NEXT_PUBLIC_MINIO_URL: ${PUBLIC_MINIO_URL}
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Reverse Proxy ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  minio_data:
